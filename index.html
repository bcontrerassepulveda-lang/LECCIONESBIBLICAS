<!doctype html>
<meta charset="utf-8">
<title>Lecciones Bíblicas — Índice</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;max-width:900px;margin:32px auto;padding:0 16px;color:#111}
  h1{font-size:1.6rem;margin-bottom:.25rem}
  p{color:#444}
  ul{padding-left:1rem}
  li{margin:.35rem 0}
  a{color:#0b63d6;text-decoration:none}
  a:hover{text-decoration:underline}
  .loading{color:#666;font-style:italic}
  .small{font-size:.9rem;color:#555}
</style>
<h1>Lecciones Bíblicas</h1>
<p class="small">Índice generado en tiempo real desde <strong>_INDICE.txt</strong>. Si los enlaces no aparecen, asegúrate de que los archivos de lección existen en el repositorio.</p>
<div id="status" class="loading">Cargando índice…</div>
<ul id="list"></ul>

<script>
async function fetchText(path){
  try{
    const res = await fetch(path, {cache: 'no-store'});
    if(!res.ok) throw new Error('no');
    return await res.text();
  }catch(e){return null}
}

function pad(n){return String(n).padStart(3,'0')}

async function exists(path){
  try{
    const res = await fetch(path, {cache: 'no-store'});
    return res.ok;
  }catch(e){
    return false;
  }
}

function safePath(p){
  // encode each segment to handle spaces and special chars
  return p.replace(/\\\\/g,'/').split('/').map(encodeURIComponent).join('/');
}

async function build(){
  const idx = await fetchText('_INDICE.txt');
  const status = document.getElementById('status');
  const list = document.getElementById('list');
  if(!idx){ status.textContent = 'No se encontró _INDICE.txt en el repositorio.'; return }
  status.textContent = '';
  const lines = idx.split(/\r?\n/);
  const itemRe = /^\s*(\d+)\s*-\s*(.+)$/;
  const entries = [];
  for(const l of lines){
    const m = l.match(itemRe);
    if(m){ entries.push({n: Number(m[1]), title: m[2].trim()}) }
  }
  for(const e of entries){
    const li = document.createElement('li');
    li.textContent = `${e.n} - ${e.title}`;
    const candidates = [
      `${pad(e.n)} - ${e.title}.txt`,
      `${e.n} - ${e.title}.txt`,
      `outputs/${pad(e.n)} - ${e.title}/leccion.txt`,
      `outputs/${e.n} - ${e.title}/leccion.txt`,
    ];
    let linked = false;
    for(const c of candidates){
      const p = safePath(c);
      // eslint-disable-next-line no-await-in-loop
      if(await exists(p)){
        const a = document.createElement('a');
        // open lesson inside viewer.html for nicer UI
        a.href = `viewer.html?f=${encodeURIComponent(p)}`;
        a.textContent = ` Ver lección`;
        a.target = '_blank';
        li.appendChild(a);
        linked = true; break;
      }
    }
    if(!linked){
      const span = document.createElement('span');
      span.textContent = ' (archivo no encontrado)';
      span.style.color = '#999';
      li.appendChild(span);
    }
    list.appendChild(li);
  }
}

build();
</script>
